name: Release

# Push a tag matching v*.*.* (e.g. v3.1.0) to trigger a build + draft release.
# See RELEASE_CHECKLIST.md for the full release process.
on:
   push:
      tags:
         - 'v*.*.*'

jobs:
   release:
      runs-on: windows-latest
      permissions:
         contents: write
      steps:
         - uses: actions/checkout@v4

         - uses: actions/setup-node@v4
           with:
              node-version: 22
              cache: yarn

         - uses: dtolnay/rust-toolchain@stable

         # yarn, not npm: the project uses yarn.lock and has no package-lock.json, so `npm ci`
         # would fail outright. --frozen-lockfile is the yarn equivalent of `npm ci` (install
         # exactly the lockfile, error on drift) rather than silently updating it.
         - name: Install frontend dependencies
           run: yarn install --frozen-lockfile

         - uses: tauri-apps/tauri-action@v1
           env:
              GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
              TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
              TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
           with:
              tagName: ${{ github.ref_name }}
              releaseName: 'Eous Modify ${{ github.ref_name }}'
              releaseBody: 'See RELEASE_CHECKLIST.md in the repo for what changed, or edit this before publishing.'
              releaseDraft: true
              prerelease: false
