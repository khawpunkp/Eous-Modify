# ===================
# ====== UI =========
# ===================
# No entities: individual UI mods are not enumerable the way agents are, so everything filed here
# lands in the automatic "Other UI" item. Present mainly so the category exists at all — it was a
# sidebar link with no row behind it on any install created after the rebuild.
[ui]
name = "UI"
entities = []

# ===================
# ==== Bangboos =====
# ===================
# "boo" rather than the full name: folders are usually named after the individual bangboo with
# "Bangboo" appended or omitted entirely, so matching the whole word would miss most of them.
[bangboos]
name = "Bangboos"
aliases = ["bangboo", "boo"]
entities = []
